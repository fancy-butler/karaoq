# Releases are automatic (after the smoke test passes): bump "version" in package.json and push to main.
# A GitHub Release (vX.Y.Z) is created with notes from the commits, and the Windows .exe,
# macOS .dmg and Linux .AppImage are built and attached (~15 min). Installed apps update from it.
# Pushes that don't change the version build nothing. Run by hand from the Actions tab to get
# test builds as artifacts without releasing.
name: Release
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Plays a whole mock party in headless Chrome. If anything's broken, nothing gets released.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node scripts/smoke.js
        env:
          CHROME: /usr/bin/google-chrome

  # iPhone stand-in: the phone page in WebKit (Safari's engine) with iPhone emulation. Screenshots are kept.
  webkit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright && npx playwright install --with-deps webkit
      - run: node scripts/webkit-check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-screenshots
          path: webkit-shots/

  check:
    needs: smoke
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.v.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          case "${{ github.event_name }}" in
            release)           echo "mode=publish" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch) echo "mode=test" >> "$GITHUB_OUTPUT" ;;
            push)
              if gh release view "v$V" >/dev/null 2>&1; then
                echo "v$V already released — nothing to do"; echo "mode=skip" >> "$GITHUB_OUTPUT"
              else
                gh release create "v$V" --title "KARAO-Q $V" --target "$GITHUB_SHA" \
                  --notes-file .github/release-header.md --generate-notes
                echo "mode=publish" >> "$GITHUB_OUTPUT"
              fi ;;
          esac

  build:
    needs: check
    if: needs.check.outputs.mode != 'skip'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]  # macos-15 = Apple Silicon, macos-15-intel = Intel Macs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle yt-dlp, ffmpeg, deno, cloudflared
        run: node scripts/fetch-binaries.js
      - name: Build installer
        run: npx electron-builder --publish ${{ needs.check.outputs.mode == 'publish' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Mac: prove the signature is valid (no "damaged" message) and that the packaged app actually starts
      - name: Check the Mac app opens
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d dist/mac*/KARAO-Q.app | head -1); echo "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier|flags'
          RES="$APP/Contents/Resources/bin"; ls "$RES"
          "$RES/yt-dlp" --version; "$RES/deno" --version | head -1; "$RES/ffmpeg" -hide_banner -version | head -1; "$RES/cloudflared" --version
          "$APP/Contents/MacOS/KARAO-Q" > app.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/api/about && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/api/about | grep -q '"version"' || { cat app.log; exit 1; }
          echo; echo "app started and its server answers"
          pkill -f "KARAO-Q.app" || true
      # Linux: open the AppImage on a (virtual) screen and check the app's server answers
      - name: Check the Linux app opens
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          AI=$(ls dist/*.AppImage | head -1); chmod +x "$AI"; echo "$AI"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$AI" --no-sandbox > app.log 2>&1 &
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:8080/api/about && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/api/about | grep -q '"version"' || { cat app.log; cat ~/.config/karaoq/data/karaoq.log 2>/dev/null | tail -30; exit 1; }
          echo; curl -fs "http://127.0.0.1:8080/api/search?q=test" > /dev/null && echo "search endpoint answers"
          echo "app started and its server answers"
          pkill -f KARAO-Q || true
      # Windows: open the unpacked app and check the app's server answers
      - name: Check the Windows app opens
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/win-unpacked -Filter 'KARAO-Q.exe' | Select-Object -First 1
          Write-Host $exe.FullName
          Start-Process -FilePath $exe.FullName
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) { try { $r = Invoke-RestMethod http://127.0.0.1:8080/api/about -TimeoutSec 2; if ($r.version) { $ok = $true; break } } catch { }; Start-Sleep 1 }
          if (-not $ok) { Get-Content "$env:APPDATA/karaoq/data/karaoq.log" -Tail 30 -ErrorAction SilentlyContinue; exit 1 }
          Write-Host "app started and its server answers (v$($r.version))"
          & "dist/win-unpacked/resources/bin/yt-dlp.exe" --version
          & "dist/win-unpacked/resources/bin/ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          Stop-Process -Name 'KARAO-Q' -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: needs.check.outputs.mode == 'test'
        with:
          name: KARAO-Q-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: ignore

  # Docker image for a NAS / home server (amd64 + arm64): ghcr.io/fancy-butler/karaoq
  docker:
    needs: check
    if: needs.check.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # quick check that the image actually starts before pushing it
      - name: Build + test (amd64)
        run: |
          docker buildx build --load -t karaoq:ci .
          docker run -d --name kq -e MOCK=1 -e TUNNEL=0 -p 8080:8080 karaoq:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/api/about && break; sleep 1; done
          curl -fs localhost:8080/api/about | grep -q '"version"'
          docker exec kq yt-dlp --version
          docker exec kq ffmpeg -hide_banner -version | head -1
          docker exec kq deno --version | head -1
          docker logs kq | tail -5
      - name: Push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/fancy-butler/karaoq:latest
            ghcr.io/fancy-butler/karaoq:${{ steps.v.outputs.v }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=KARAO-Q — YouTube karaoke party queue server
            org.opencontainers.image.licenses=MIT
