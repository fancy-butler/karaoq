# Builds the one-download installers (Windows .exe, macOS .dmg, Linux .AppImage).
# Publish a release on GitHub (Releases → Draft a new release → new tag like v0.3.0 → Publish)
# → all three installers get attached to that release automatically (~15 min).
# Run it by hand from the Actions tab → the installers appear as downloadable artifacts (no release).
name: Build installers
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle yt-dlp, ffmpeg, deno, cloudflared
        run: node scripts/fetch-binaries.js
      - name: Build installer
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: KARAO-Q-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: ignore
